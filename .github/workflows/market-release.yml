name: Build marketplace packages
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python release/build_market.py --inputs /tmp/translator-inputs --output /tmp/translator-market
      - name: Upload to draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view v0.1.17 --json isDraft --jq .isDraft)" = true
          gh release upload v0.1.17 /tmp/translator-market/*
